name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiatlas
          POSTGRES_PASSWORD: aiatlas
          POSTGRES_DB: aiatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aiatlas:aiatlas@localhost:5432/aiatlas?schema=public
      AUTH_SECRET: ci-secret
      NEXTAUTH_SECRET: ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Commit build log for debugging (public via raw.githubusercontent.com)
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add build.log
          git commit -m "CI: build log for $(git rev-parse --short HEAD) [skip ci]"
          git push origin HEAD:main
