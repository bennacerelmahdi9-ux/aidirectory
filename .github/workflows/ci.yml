name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiatlas
          POSTGRES_PASSWORD: aiatlas
          POSTGRES_DB: aiatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aiatlas:aiatlas@localhost:5432/aiatlas?schema=public
      AUTH_SECRET: ci-secret
      NEXTAUTH_SECRET: ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Publish build log to a public paste, then record URL as a commit status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          URL=$(curl -s --data-binary @build.log https://paste.rs)
          echo "Build log: $URL"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/$SHA" \
            -d "{\"state\":\"failure\",\"context\":\"build-log\",\"description\":\"$URL\",\"target_url\":\"$URL\"}"
